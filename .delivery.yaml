  um-jogo-por-vez: "Um agente usa o FM por vez. Pegue o lock C:\\Code\\fm-lock (criação exclusiva) antes de escrever no jogo e solte no fim. Enquanto C:\\Code\\fm-busy-mods.txt existir, ninguém escreve no jogo."
  conflitos: "README, MappingConfig e o registro de tools no Program conflitam entre trilhas. Faça rebase na main antes do PR e rode os testes de novo."
